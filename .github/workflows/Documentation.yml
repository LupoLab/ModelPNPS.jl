name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# Luna's `Plotting.jl` does an unconditional `using PyPlot`, so `import ModelPNPS`
# needs a working matplotlib. An empty PYTHON makes PyCall build against its own
# Conda python rather than the runner's /usr/bin/python3, and PyPlot then installs
# matplotlib itself on first import. Without this the build passes only when a
# cached depot happens to carry a working PyCall, and fails on a cold runner.
env:
  PYTHON: ""

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
