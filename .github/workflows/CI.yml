name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# Luna's `Plotting.jl` does an unconditional `using PyPlot`, so `import ModelPNPS`
# needs a working matplotlib. An empty PYTHON makes PyCall build against its own
# Conda python rather than the runner's /usr/bin/python3, and PyPlot then installs
# matplotlib itself on first import. Without this the build passes only when a
# cached depot happens to carry a working PyCall, and fails on a cold runner.
env:
  PYTHON: ""

jobs:
  test:
    # The full suite: unit tests, Aqua, ExplicitImports, JET error analysis and
    # doctests. `[compat] julia` is 1.12, so nothing older is tested.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  quality:
    # The Quality group on its own, so a hygiene regression is a distinct red
    # check rather than one failure buried in the full run.
    name: Aqua, ExplicitImports and JET
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: Quality

  format:
    # Runic owns formatting and has no configuration, so this is a pass/fail
    # check on the exact command from AGENTS.md. Runic lives in its own shared
    # environment and is deliberately not a project dependency.
    name: Runic formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install Runic
        run: julia --project=@runic --startup-file=no -e 'using Pkg; Pkg.add("Runic")'
      - name: Check formatting
        run: julia --project=@runic -m Runic --check --diff src test docs
